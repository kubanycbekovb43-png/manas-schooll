let lang = "kg";

function applyDict(){
  const d = dict[lang];
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    el.textContent = d[el.dataset.i18n] || "";
  });
}

function renderCoaches(filter){
  const map = lang==="kg" ? sportKG : sportRU;
  const noAch = lang==="kg" ? "—" : "—";
  const rows = coaches

      <td>${map[c.s]}</td>
      <td>${c.e} ${lang==="kg"?"жыл":"лет"}</td>
      <td class="ach">${c.a.length ? c.a.join("<br>") : noAch}</td>
    </tr>`).join("");
  document.getElementById("coach-body").innerHTML = rows;
}

function renderFilters(){
  const map = lang==="kg" ? sportKG : sportRU;
  const allLbl = lang==="kg" ? "Баары" : "Все";
  const keys = ["all",...Object.keys(map)];
  const bar = document.getElementById("filterbar");
  bar.innerHTML = keys.map(k=>`<button data-f="${k}" class="${k==='all'?'on':''}">${k==='all'?allLbl:map[k]}</button>`).join("");
  bar.querySelectorAll("button").forEach(b=>{

      b.classList.add("on");

    };
  });
}

function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.getElementById("btn-kg").classList.toggle("active", l==="kg");
  document.getElementById("btn-ru").classList.toggle("active", l==="ru");
  applyDict();
  renderFilters();
  renderCoaches("all");
}

// count-up animation, respects reduced motion
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
document.querySelectorAll(".num[data-count]").forEach(el=>{
  const target = +el.dataset.count;
  if(reduce){ el.textContent = target; return; }
  const io = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        let start=null; const dur=900;
        function step(ts){
          if(!start) start=ts;
          const p = Math.min((ts-start)/dur,1);
          el.textContent = Math.floor(p*target);
          if(p<1) requestAnimationFrame(step); else el.textContent = target;
        }
        requestAnimationFrame(step);
        io.disconnect();
      }
    });
  },{threshold:.4});
  io.observe(el);
});
